    <!-- DADOS REAIS — Cotações Recebidas (Site) -->
    <script>
        const EDGE_PAINEL = "https://abjzskmxfcqsxcoybsdg.supabase.co/functions/v1/frc-painel-eficiencia";

        const fmtNum = (n) => Number(n ?? 0).toLocaleString('pt-BR');
        const fmtPct = (p) => Math.abs(p).toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 });

        const hojeISO = () => {
            const d = new Date();
            return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        };
        const primeiroDiaMesISO = () => {
            const d = new Date();
            return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-01';
        };

        async function atualizarCotacoes() {
            const ini = document.getElementById('dataInicio').value;
            const fim = document.getElementById('dataFim').value;
            const cat = document.getElementById('filtroCategoria').value;
            const elValor = document.getElementById('kpiCotacoesValor');
            const elVar = document.getElementById('kpiCotacoesVar');
            if (!ini || !fim) return;

            elValor.textContent = '…';
            elVar.textContent = 'carregando…';

            try {
                const resp = await fetch(EDGE_PAINEL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        metric: 'cotacoes_recebidas',
                        data_inicio: ini,
                        data_fim: fim,
                        categoria_id: cat === '' ? null : Number(cat)
                    })
                });
                const j = await resp.json();
                if (!j.ok) throw new Error(j.error || 'erro');

                elValor.textContent = fmtNum(j.atual);

                const base = 'text-[10px] font-bold px-1.5 py-0.5 rounded mt-2 inline-block ';
                if (j.variacao_pct === null) {
                    elVar.className = base + 'text-slate-400 bg-slate-500/10';
                    elVar.textContent = 'sem período anterior para comparar';
                } else if (j.variacao_pct >= 0) {
                    elVar.className = base + 'text-accentGreen bg-emerald-500/10';
                    elVar.textContent = '↑ +' + fmtPct(j.variacao_pct) + '% vs. período anterior';
                } else {
                    elVar.className = base + 'text-accentRed bg-red-500/10';
                    elVar.textContent = '↓ -' + fmtPct(j.variacao_pct) + '% vs. período anterior';
                }
            } catch (e) {
                elValor.textContent = '—';
                elVar.className = 'text-[10px] font-bold px-1.5 py-0.5 rounded mt-2 inline-block text-accentRed bg-red-500/10';
                elVar.textContent = 'erro ao carregar';
            }
        }

            if (!ini || !fim) return;

            elValor.textContent = '…';
            elVar.textContent = 'carregando…';

            try {
                const resp = await fetch(EDGE_PAINEL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ metric: 'fluxo_cadencia', data_inicio: ini, data_fim: fim })
                });
                const j = await resp.json();
                if (!j.ok) throw new Error(j.error || 'erro');

                const saldo = j.saldo;
                const sinal = saldo > 0 ? '+' : (saldo < 0 ? '−' : '');
                elValor.textContent = sinal + fmtNum(Math.abs(saldo));
                elValor.className = 'text-2xl font-black mt-1 ' + (saldo >= 0 ? 'text-accentGreen' : 'text-accentRed');

                const base = 'text-[10px] font-bold px-1.5 py-0.5 rounded mt-2 inline-block ';
                const seta = saldo >= 0 ? '▲ enchendo' : '▼ esvaziando';
                elVar.className = base + (saldo >= 0 ? 'text-accentGreen bg-emerald-500/10' : 'text-accentRed bg-red-500/10');
                elVar.textContent = seta + ' · ' + fmtNum(j.entradas) + ' entraram / ' + fmtNum(j.saidas) + ' saíram';
            } catch (e) {
                elValor.textContent = '—';
                elValor.className = 'text-2xl font-black text-white mt-1';
                elVar.className = 'text-[10px] font-bold px-1.5 py-0.5 rounded mt-2 inline-block text-accentRed bg-red-500/10';
                elVar.textContent = 'erro ao carregar';
            }
        }

        // Gráfico — Volume Diário (4 linhas reais no período/categoria)
        async function atualizarGrafico() {
            const ini = document.getElementById('dataInicio').value;
            const fim = document.getElementById('dataFim').value;
            const cat = document.getElementById('filtroCategoria').value;
            const chart = window.chartAtividadesInst;
            if (!ini || !fim || !chart) return;
            try {
                const resp = await fetch(EDGE_PAINEL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ metric: 'series_diario', data_inicio: ini, data_fim: fim, categoria_id: cat === '' ? null : Number(cat) })
                });
                const j = await resp.json();
                if (!j.ok) throw new Error(j.error || 'erro');
                chart.data.labels = j.labels.map(d => d.slice(8, 10) + '/' + d.slice(5, 7));
                chart.data.datasets[0].data = j.series.cotacoes;
                chart.data.datasets[1].data = j.series.leads;
                chart.data.datasets[2].data = j.series.reservas;
                chart.data.datasets[3].data = j.series.saldo;
                chart.update();
            } catch (e) { /* mantém o gráfico anterior em caso de erro */ }
        }

        // Tabela — Eficiência por vendedor (funil lead-a-lead + vouchers reais Dunas)
        async function atualizarTabelaVendedores() {
            const ini = document.getElementById('dataInicio').value;
            const fim = document.getElementById('dataFim').value;
            const tbody = document.getElementById('tabelaVendedoresBody');
            if (!ini || !fim || !tbody) return;
            tbody.innerHTML = '<tr><td colspan="4" class="py-3 text-center text-slate-500">carregando…</td></tr>';
            try {
                const resp = await fetch(EDGE_PAINEL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ metric: 'tabela_vendedores', data_inicio: ini, data_fim: fim })
                });
                const j = await resp.json();
                if (!j.ok) throw new Error(j.error || 'erro');
                if (!j.rows || !j.rows.length) {
                    tbody.innerHTML = '<tr><td colspan="4" class="py-3 text-center text-slate-500">sem dados no período</td></tr>';
                    return;
                }
                tbody.innerHTML = j.rows.map(r => {
                    const eng = r.engajamento_pct;
                    const corEng = (eng === null || eng === undefined) ? 'text-slate-400'
                        : (eng >= 60 ? 'text-accentGreen' : (eng >= 40 ? 'text-yellow-500' : 'text-accentRed'));
                    const engTxt = (eng === null || eng === undefined) ? '—' : ('(' + eng + '%)');
                    const conv = r.conversao_pct;
                    const corConv = (conv === null || conv === undefined) ? 'text-slate-500'
                        : (conv >= 30 ? 'text-accentGreen' : (conv >= 15 ? 'text-yellow-500' : 'text-accentRed'));
                    const convTxt = (conv === null || conv === undefined) ? '—' : ('(' + conv + '%)');
                    return '<tr class="hover:bg-slate-800/30 transition-colors cursor-pointer">' +
                        '<td class="py-2.5 font-medium text-white">' + (r.seller_name || '—') + '</td>' +
                        '<td class="py-2.5 text-center text-slate-300">' + fmtNum(r.abordados) + '</td>' +
                        '<td class="py-2.5 text-center text-slate-300">' + fmtNum(r.respondidos) + ' <span class="' + corEng + '">' + engTxt + '</span></td>' +
                        '<td class="py-2.5 text-right text-white font-bold">' + fmtNum(r.vouchers) + ' <span class="' + corConv + '">' + convTxt + '</span></td>' +
                        '</tr>';
                }).join('');
            } catch (e) {
                tbody.innerHTML = '<tr><td colspan="4" class="py-3 text-center text-accentRed">erro ao carregar</td></tr>';
            }
        }

        // Formata minutos → "11,4 min" ou "2h 26min"
        function fmtTempo(min) {
            if (min < 60) return min.toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' <span class="text-sm font-normal text-slate-400">min</span>';
            return Math.floor(min / 60) + 'h ' + Math.round(min % 60) + '<span class="text-sm font-normal text-slate-400">min</span>';
        }
        function fmtDelta(min) {
            if (min < 60) return min.toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' min';
            return Math.floor(min / 60) + 'h' + Math.round(min % 60);
        }

        // Card SLA — Speed to Lead Geral (mediana entrada Comercial → 1ª resposta). Tempo: cair = verde
        async function atualizarSpeed() {
            const ini = document.getElementById('dataInicio').value;
            const fim = document.getElementById('dataFim').value;
            const elValor = document.getElementById('kpiSpeedValor');
            const elVar = document.getElementById('kpiSpeedVar');
            if (!ini || !fim) return;
            elValor.textContent = '…';
            elVar.textContent = 'carregando…';
            try {
                const resp = await fetch(EDGE_PAINEL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ metric: 'speed_to_lead', data_inicio: ini, data_fim: fim })
                });
                const j = await resp.json();
                if (!j.ok) throw new Error(j.error || 'erro');

                const base = 'text-[10px] font-bold px-1.5 py-0.5 rounded mt-2 inline-block ';
                if (j.mediana_min === null) {
                    elValor.innerHTML = '<span class="text-slate-500">sem dados</span>';
                    elVar.className = base + 'text-slate-400 bg-slate-500/10';
                    elVar.textContent = 'sem mensagem registrada no período';
                    return;
                }
                elValor.innerHTML = fmtTempo(j.mediana_min);

                if (j.mediana_anterior_min === null) {
                    elVar.className = base + 'text-slate-400 bg-slate-500/10';
                    elVar.textContent = 'sem período anterior para comparar';
                } else {
                    const d = j.mediana_min - j.mediana_anterior_min;
                    if (d < 0) {
                        elVar.className = base + 'text-accentGreen bg-emerald-500/10';
                        elVar.textContent = '↓ ' + fmtDelta(Math.abs(d)) + ' mais rápido vs. período anterior';
                    } else if (d > 0) {
                        elVar.className = base + 'text-accentRed bg-red-500/10';
                        elVar.textContent = '↑ ' + fmtDelta(Math.abs(d)) + ' mais lento vs. período anterior';
                    } else {
                        elVar.className = base + 'text-slate-400 bg-slate-500/10';
                        elVar.textContent = 'igual ao período anterior';
                    }
                }
            } catch (e) {
                elValor.innerHTML = '<span class="text-accentRed">—</span>';
                elVar.className = 'text-[10px] font-bold px-1.5 py-0.5 rounded mt-2 inline-block text-accentRed bg-red-500/10';
                elVar.textContent = 'erro ao carregar';
            }
        }

        // Card SLA — Ciclo Lead → Reserva (mediana em dias). Menos dias = verde
        async function atualizarCiclo() {
            const ini = document.getElementById('dataInicio').value;
            const fim = document.getElementById('dataFim').value;
            const elValor = document.getElementById('kpiCicloValor');
            const elVar = document.getElementById('kpiCicloVar');
            if (!ini || !fim) return;
            elValor.textContent = '…';
            elVar.textContent = 'carregando…';
            try {
                const resp = await fetch(EDGE_PAINEL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ metric: 'ciclo_lead_reserva', data_inicio: ini, data_fim: fim })
                });
                const j = await resp.json();
                if (!j.ok) throw new Error(j.error || 'erro');
                const base = 'text-[10px] font-bold px-1.5 py-0.5 rounded mt-2 inline-block ';
                if (j.mediana_dias === null) {
                    elValor.innerHTML = '<span class="text-slate-500">sem dados</span>';
                    elVar.className = base + 'text-slate-400 bg-slate-500/10';
                    elVar.textContent = 'sem venda confirmada no período';
                    return;
                }
                elValor.innerHTML = j.mediana_dias.toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' <span class="text-sm font-normal text-slate-400">dias</span>';
                if (j.mediana_anterior_dias === null) {
                    elVar.className = base + 'text-slate-400 bg-slate-500/10';
                    elVar.textContent = 'sem período anterior para comparar';
                } else {
                    const d = j.mediana_dias - j.mediana_anterior_dias;
                    const dtxt = Math.abs(d).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' dias';
                    if (d < 0) { elVar.className = base + 'text-accentGreen bg-emerald-500/10'; elVar.textContent = '↓ ' + dtxt + ' mais rápido vs. período anterior'; }
                    else if (d > 0) { elVar.className = base + 'text-accentRed bg-red-500/10'; elVar.textContent = '↑ ' + dtxt + ' mais lento vs. período anterior'; }
                    else { elVar.className = base + 'text-slate-400 bg-slate-500/10'; elVar.textContent = 'igual ao período anterior'; }
                }
            } catch (e) {
                elValor.innerHTML = '<span class="text-accentRed">—</span>';
                elVar.className = 'text-[10px] font-bold px-1.5 py-0.5 rounded mt-2 inline-block text-accentRed bg-red-500/10';
                elVar.textContent = 'erro ao carregar';
            }
        }

        // Card SLA — % de simulações reais atendidas na meta (5 min). Maior = verde
        async function atualizarSla() {
            const ini = document.getElementById('dataInicio').value;
            const fim = document.getElementById('dataFim').value;
            const elValor = document.getElementById('kpiSlaValor');
            const elVar = document.getElementById('kpiSlaVar');
            if (!ini || !fim) return;
            elValor.textContent = '…';
            elVar.textContent = 'carregando…';
            try {
                const resp = await fetch(EDGE_PAINEL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ metric: 'sla_simulacao', data_inicio: ini, data_fim: fim, meta_min: 5 })
                });
                const j = await resp.json();
                if (!j.ok) throw new Error(j.error || 'erro');
                const base = 'text-[10px] font-bold px-1.5 py-0.5 rounded mt-2 inline-block ';
                if (j.pct_atual === null) {
                    elValor.innerHTML = '<span class="text-slate-500">sem dados</span>';
                    elVar.className = base + 'text-slate-400 bg-slate-500/10';
                    elVar.textContent = 'sem simulação no período';
                    return;
                }
                elValor.innerHTML = j.pct_atual.toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + '<span class="text-sm font-normal text-slate-400">%</span>';
                if (j.pct_anterior === null) {
                    elVar.className = base + 'text-slate-400 bg-slate-500/10';
                    elVar.textContent = 'atendidos em ≤ ' + j.meta_min + ' min';
                } else {
                    const d = j.pct_atual - j.pct_anterior;
                    const dtxt = Math.abs(d).toLocaleString('pt-BR', { maximumFractionDigits: 1 });
                    if (d >= 0) { elVar.className = base + 'text-accentGreen bg-emerald-500/10'; elVar.textContent = '↑ +' + dtxt + ' pts · atendidos em ≤ ' + j.meta_min + ' min'; }
                    else { elVar.className = base + 'text-accentRed bg-red-500/10'; elVar.textContent = '↓ -' + dtxt + ' pts · atendidos em ≤ ' + j.meta_min + ' min'; }
                }
            } catch (e) {
                elValor.innerHTML = '<span class="text-accentRed">—</span>';
                elVar.className = 'text-[10px] font-bold px-1.5 py-0.5 rounded mt-2 inline-block text-accentRed bg-red-500/10';
                elVar.textContent = 'erro ao carregar';
            }
        }

        // Gráfico — Horário de pico das vendas (barras: laranja=pico, âmbar=alto, azul=resto)
        async function atualizarGraficoHoras() {
            const ini = document.getElementById('dataInicio').value;
            const fim = document.getElementById('dataFim').value;
            const chart = window.chartSlaHorarioInst;
            if (!ini || !fim || !chart) return;
            try {
                const resp = await fetch(EDGE_PAINEL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ metric: 'vendas_por_hora', data_inicio: ini, data_fim: fim })
                });
                const j = await resp.json();
                if (!j.ok) throw new Error(j.error || 'erro');
                const max = Math.max(1, ...j.data);
                const cores = j.data.map(v => v >= 0.8 * max ? '#f97316' : (v >= 0.5 * max ? '#f59e0b' : '#0284c7'));
                chart.data.labels = j.labels;
                chart.data.datasets[0].data = j.data;
                chart.data.datasets[0].backgroundColor = cores;
                chart.update();
            } catch (e) { /* mantém o gráfico anterior em caso de erro */ }
        }

        // Card SLA — % de cotações que fecham em ≤7 dias (janela madura). Maior = verde
        async function atualizarCiclo7() {
            const ini = document.getElementById('dataInicio').value;
            const fim = document.getElementById('dataFim').value;
            const elValor = document.getElementById('kpiCiclo7Valor');
            const elVar = document.getElementById('kpiCiclo7Var');
            if (!ini || !fim) return;
            elValor.textContent = '…';
            elVar.textContent = 'carregando…';
            try {
                const resp = await fetch(EDGE_PAINEL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ metric: 'conversao_7dias', data_inicio: ini, data_fim: fim, dias: 7 })
                });
                const j = await resp.json();
                if (!j.ok) throw new Error(j.error || 'erro');
                const base = 'text-[10px] font-bold px-1.5 py-0.5 rounded mt-2 inline-block ';
                if (j.pct_atual === null) {
                    elValor.innerHTML = '<span class="text-slate-500">sem dados</span>';
                    elVar.className = base + 'text-slate-400 bg-slate-500/10';
                    elVar.textContent = 'sem cotação madura no período';
                    return;
                }
                elValor.innerHTML = j.pct_atual.toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + '<span class="text-sm font-normal text-slate-400">%</span>';
                if (j.pct_anterior === null) {
                    elVar.className = base + 'text-slate-400 bg-slate-500/10';
                    elVar.textContent = 'fecham em ≤ ' + j.dias + ' dias';
                } else {
                    const d = j.pct_atual - j.pct_anterior;
                    const dtxt = Math.abs(d).toLocaleString('pt-BR', { maximumFractionDigits: 1 });
                    if (d >= 0) { elVar.className = base + 'text-accentGreen bg-emerald-500/10'; elVar.textContent = '↑ +' + dtxt + ' pts · fecham em ≤ ' + j.dias + ' dias'; }
                    else { elVar.className = base + 'text-accentRed bg-red-500/10'; elVar.textContent = '↓ -' + dtxt + ' pts · fecham em ≤ ' + j.dias + ' dias'; }
                }
            } catch (e) {
                elValor.innerHTML = '<span class="text-accentRed">—</span>';
                elVar.className = 'text-[10px] font-bold px-1.5 py-0.5 rounded mt-2 inline-block text-accentRed bg-red-500/10';
                elVar.textContent = 'erro ao carregar';
            }
        }

        // Painel de Sinais — 5 análises geradas por IA (Claude) sobre o período
        const escHtml = (s) => String(s == null ? '' : s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
        const estiloSinal = {
            critico:  { bg: 'bg-red-500/10',     bd: 'border-red-500/25',     tc: 'text-accentRed',   dot: '🔴' },
            atencao:  { bg: 'bg-yellow-500/10',  bd: 'border-yellow-500/25',  tc: 'text-yellow-500',  dot: '🟡' },
            positivo: { bg: 'bg-emerald-500/10', bd: 'border-emerald-500/25', tc: 'text-accentGreen', dot: '🟢' },
            info:     { bg: 'bg-sky-500/10',     bd: 'border-sky-500/25',     tc: 'text-floridaBlue', dot: '🔵' }
        };
        async function atualizarSinais() {
            const ini = document.getElementById('dataInicio').value;
            const fim = document.getElementById('dataFim').value;
            const box = document.getElementById('sinaisBox');
            if (!ini || !fim || !box) return;
            box.innerHTML = '<div class="p-3.5 text-center text-slate-500 text-xs">analisando o período com IA…</div>';
            try {
                const resp = await fetch(EDGE_PAINEL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ metric: 'sinais', data_inicio: ini, data_fim: fim })
                });
                const j = await resp.json();
                if (!j.ok || !j.sinais || !j.sinais.length) throw new Error(j.error || 'sem sinais');
                box.innerHTML = j.sinais.map(s => {
                    const e = estiloSinal[s.severidade] || estiloSinal.info;
                    return '<div class="p-3.5 ' + e.bg + ' border ' + e.bd + ' rounded-xl">' +
                        '<h4 class="text-xs font-bold text-white flex items-start gap-1.5"><span>' + e.dot + '</span><span>' + escHtml(s.titulo) + '</span></h4>' +
                        '<p class="text-[10.5px] text-slate-400 mt-1 leading-relaxed">' + escHtml(s.descricao) + '</p>' +
                        '<p class="text-[10px] mt-1.5 ' + e.tc + ' font-semibold">▸ ' + escHtml(s.acao) + '</p>' +
                        '</div>';
                }).join('');
            } catch (e) {
                box.innerHTML = '<div class="p-3.5 text-center text-accentRed text-xs">não foi possível gerar os sinais agora</div>';
            }
        }
        // Debounce: junta mudanças rápidas de filtro numa análise só (a IA leva alguns segundos)
        let sinaisTimer = null;
        function atualizarSinaisDebounced() {
            const box = document.getElementById('sinaisBox');
            if (box) box.innerHTML = '<div class="p-3.5 text-center text-slate-500 text-xs">analisando o período com IA…</div>';
            clearTimeout(sinaisTimer);
            sinaisTimer = setTimeout(atualizarSinais, 1000);
        }

        // Atualiza todos os cards ligados de uma vez
        function atualizarPainel() {
            atualizarCotacoes();
            atualizarComercial();
            atualizarConfirmadas();
            atualizarFluxo();
            atualizarGrafico();
            atualizarTabelaVendedores();
            atualizarSpeed();
            atualizarCiclo();
            atualizarSla();
            atualizarGraficoHoras();
            atualizarCiclo7();
            atualizarSinaisDebounced();
        }

        // Datas padrão: 1º dia do mês → hoje
        document.getElementById('dataInicio').value = primeiroDiaMesISO();
        document.getElementById('dataFim').value = hojeISO();

        // Recalcula ao mudar qualquer filtro (change + input = robusto pra calendário ou digitação)
        ['dataInicio', 'dataFim', 'filtroCategoria'].forEach(id => {
            const el = document.getElementById(id);
            el.addEventListener('change', atualizarPainel);
            el.addEventListener('input', atualizarPainel);
        });

        // Primeira carga
        atualizarPainel();
    <\/script>
</body>
</html>
</script>
<script type="text/html" id="src1">
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Florida Rental Car - SLA & Speed to Lead</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"><\/script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"><\/script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#080e1a',
                        cardBg: '#111b2d',
                        floridaOrange: '#f97316', // Laranja Sol da Flórida
                        floridaBlue: '#0284c7', // Azul Miami
                        accentGreen: '#10b981',
                        accentRed: '#ef4444'
                    }
                }
            }
        }
    <\/script>
    <style>
        .smooth-card {
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .glow-orange:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 25px -10px rgba(249, 115, 22, 0.4);
            border-color: rgba(249, 115, 22, 0.5);
            background-color: #1a1f33;
        }
        .glow-blue:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 25px -10px rgba(2, 132, 199, 0.4);
            border-color: rgba(2, 132, 199, 0.5);
            background-color: #12233f;
        }
    </style>
</head>
<body class="bg-darkBg text-slate-100 font-sans min-h-screen p-6">

    <!-- Header Principal -->
    <header class="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4 mb-8 pb-6 border-b border-slate-800">
        <div>
            <span class="text-xs font-bold text-floridaBlue uppercase tracking-widest bg-sky-500/10 px-3 py-1 rounded-full">Florida Rental Car • Performance de Atendimento</span>
            <h1 class="text-3xl font-extrabold text-white tracking-tight mt-2">1B. SLA e Speed to Lead</h1>
            <p class="text-sm text-slate-400">Tempo de resposta do lead no primeiro contato e dias médios para transição de etapa no CRM.</p>
        </div>
        
        <!-- Filtros Táticos -->
        <div class="flex flex-wrap gap-3">
            <div class="flex items-center gap-2 bg-cardBg border border-slate-800 hover:border-slate-700 rounded-xl px-4 py-2.5 transition-all">
                <span class="text-xs text-slate-400 font-semibold uppercase tracking-wider">Período</span>
                <input type="date" id="dataInicio" class="bg-transparent text-sm text-slate-300 focus:outline-none cursor-pointer [color-scheme:dark]">
                <span class="text-slate-500 text-sm">até</span>
                <input type="date" id="dataFim" class="bg-transparent text-sm text-slate-300 focus:outline-none cursor-pointer [color-scheme:dark]">
            </div>
        </div>
    </header>

    <!-- GRID SUPERIOR: KPIs DE SLA (IGUAIS À DISPOSIÇÃO DA FOTO) -->

    <script>

    <!-- DADOS REAIS -->
    <script>
        const EDGE_PAINEL = "https://abjzskmxfcqsxcoybsdg.supabase.co/functions/v1/frc-painel-eficiencia";

        const hojeISO = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
        const primeiroDiaMesISO = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-01'; };
        const fmtNum = (n) => Number(n ?? 0).toLocaleString('pt-BR', { maximumFractionDigits: 1 });
        function fmtTempo(min) {
            if (min < 60) return fmtNum(min) + ' <span class="text-2xl font-normal text-slate-400">min</span>';
            return Math.floor(min / 60) + 'h ' + Math.round(min % 60) + '<span class="text-2xl font-normal text-slate-400">min</span>';
        }
        function fmtDur(min) { return min < 60 ? fmtNum(min) + ' min' : Math.floor(min / 60) + 'h' + String(Math.round(min % 60)).padStart(2, '0'); }
        const post = (b) => fetch(EDGE_PAINEL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(b) }).then(r => r.json());

        async function atualizarCard1() {
            const ini = document.getElementById('dataInicio').value, fim = document.getElementById('dataFim').value;
            const ev = document.getElementById('kpiTempoValor'), evar = document.getElementById('kpiTempoVar');
            if (!ini || !fim) return;
            ev.textContent = '…'; evar.textContent = 'carregando…';
            try {
                const j = await post({ metric: 'speed_to_lead', data_inicio: ini, data_fim: fim });
                if (!j.ok) throw 0;
                const base = 'text-xs font-bold px-2 py-0.5 rounded mt-3 inline-block ';
                if (j.mediana_min === null) { ev.innerHTML = '<span class="text-slate-500">sem dados</span>'; evar.className = base + 'text-slate-400 bg-slate-500/10'; evar.textContent = 'sem mensagem no período'; return; }
                ev.innerHTML = fmtTempo(j.mediana_min);
                if (j.mediana_anterior_min === null) { evar.className = base + 'text-slate-400 bg-slate-500/10'; evar.textContent = 'sem período anterior'; }
                else { const d = j.mediana_min - j.mediana_anterior_min;
                    if (d < 0) { evar.className = base + 'text-accentGreen bg-emerald-500/10'; evar.textContent = '↓ ' + fmtDur(Math.abs(d)) + ' mais rápido vs. período anterior'; }
                    else if (d > 0) { evar.className = base + 'text-accentRed bg-red-500/10'; evar.textContent = '↑ ' + fmtDur(Math.abs(d)) + ' mais lento vs. período anterior'; }
                    else { evar.className = base + 'text-slate-400 bg-slate-500/10'; evar.textContent = 'igual ao período anterior'; }
                }
            } catch { ev.innerHTML = '<span class="text-accentRed">—</span>'; evar.textContent = 'erro'; }
        }
        async function atualizarCard2() {
            const ini = document.getElementById('dataInicio').value, fim = document.getElementById('dataFim').value;
            const ev = document.getElementById('kpiSla10Valor'), evar = document.getElementById('kpiSla10Var');
            if (!ini || !fim) return;
            ev.textContent = '…'; evar.textContent = 'carregando…';
            try {
                const j = await post({ metric: 'sla_simulacao', data_inicio: ini, data_fim: fim, meta_min: META_MIN });
                if (!j.ok) throw 0;
                const base = 'text-xs font-bold px-2 py-0.5 rounded mt-3 inline-block ';
                if (j.pct_atual === null) { ev.innerHTML = '<span class="text-slate-500">sem dados</span>'; evar.className = base + 'text-slate-400 bg-slate-500/10'; evar.textContent = 'sem simulação no período'; return; }
                ev.innerHTML = fmtNum(j.pct_atual) + '<span class="text-2xl font-normal text-slate-400">%</span>';
                if (j.pct_anterior === null) { evar.className = base + 'text-slate-400 bg-slate-500/10'; evar.textContent = 'atendidos em ≤ ' + META_MIN + ' min'; }
                else { const d = j.pct_atual - j.pct_anterior;
                    if (d >= 0) { evar.className = base + 'text-accentGreen bg-emerald-500/10'; evar.textContent = '↑ +' + fmtNum(Math.abs(d)) + ' pts vs. período anterior'; }
                    else { evar.className = base + 'text-accentRed bg-red-500/10'; evar.textContent = '↓ -' + fmtNum(Math.abs(d)) + ' pts vs. período anterior'; }
                }
            } catch { ev.innerHTML = '<span class="text-accentRed">—</span>'; evar.textContent = 'erro'; }
        }
        async function atualizarSeries() {
            const ini = document.getElementById('dataInicio').value, fim = document.getElementById('dataFim').value;
            if (!ini || !fim) return;
            try {
                const j = await post({ metric: 'sla_series_diario', data_inicio: ini, data_fim: fim, meta_min: META_MIN });
                if (!j.ok) return;
                const labels = j.labels.map(d => d.slice(8, 10) + '/' + d.slice(5, 7));
                window.chart1B_min.data.labels = labels; window.chart1B_min.data.datasets[0].data = j.mediana; window.chart1B_min.update();
                window.chart1B_pct.data.labels = labels; window.chart1B_pct.data.datasets[0].data = j.sla; window.chart1B_pct.update();
            } catch {}
        }
        async function atualizarDist() {
            const ini = document.getElementById('dataInicio').value, fim = document.getElementById('dataFim').value;
            if (!ini || !fim) return;
            try {
                const j = await post({ metric: 'speed_distribuicao', data_inicio: ini, data_fim: fim });
                if (!j.ok) return;
                window.chart1B_dist.data.labels = j.labels; window.chart1B_dist.data.datasets[0].data = j.data; window.chart1B_dist.update();
            } catch {}
        }
        async function atualizarTrans() {
            const ini = document.getElementById('dataInicio').value, fim = document.getElementById('dataFim').value;
            if (!ini || !fim) return;
            try {
                const j = await post({ metric: 'transicao_etapas', data_inicio: ini, data_fim: fim });
                if (!j.ok) return;
                window.chart1B_trans.data.labels = j.labels; window.chart1B_trans.data.datasets[0].data = j.dias; window.chart1B_trans.update();
            } catch {}
        }
        function atualizarPainel1B() { atualizarCard1(); atualizarCard2(); atualizarSeries(); atualizarDist(); atualizarTrans(); }

        document.getElementById('dataInicio').value = primeiroDiaMesISO();
        document.getElementById('dataFim').value = hojeISO();
        ['dataInicio', 'dataFim'].forEach(id => {
            const el = document.getElementById(id);
            el.addEventListener('change', atualizarPainel1B);
            el.addEventListener('input', atualizarPainel1B);
        });
        atualizarPainel1B();
    <\/script>
</body>

</script>

    <script>

        const FLOOR_RECEITA = '2025-12-01'; // Dunas confiável a partir daqui; antes: receita/conversão/retorno = sem dado (cotações e cohort valem pra todo histórico)
        const fmtInt = n => (n == null ? '—' : Number(n).toLocaleString('pt-BR'));
        const fmtBRL = n => (n == null ? '—' : 'R$ ' + Number(n).toLocaleString('pt-BR'));
        const fmtPct = n => (n == null ? '—' : Number(n).toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + '%');
        function fmtReceita(n) {
            if (n == null) return '—';
            n = Number(n);
            if (n >= 1e6) return 'R$ ' + (n / 1e6).toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + ' mi';
            if (n >= 1e3) return 'R$ ' + Math.round(n / 1e3).toLocaleString('pt-BR') + ' mil';
            return 'R$ ' + Math.round(n).toLocaleString('pt-BR');
        }
        function isoHoje() { return new Date().toISOString().slice(0, 10); }
        function isoMesesAtras(m) { const d = new Date(); d.setMonth(d.getMonth() - m); return d.toISOString().slice(0, 10); }
        function fmtDataBR(iso) { const [a, m, d] = iso.split('-'); return `${d}/${m}/${a}`; }
        const CORES_CANAL = {
            'Sem rastreio': '#64748b', 'Meta / Pago': '#0284c7', 'Instagram / Orgânico': '#ec4899',
            'Google / Pago': '#f97316', 'Google / Orgânico': '#10b981', 'Indicação': '#8b5cf6',
            'Site / Direto': '#14b8a6', 'Agências / B2B': '#eab308'
        };

        async function carregarMatriz() {
            const di = document.getElementById('dtIni').value, df = document.getElementById('dtFim').value;
            const body = document.getElementById('matrizBody');
            const per = document.getElementById('matrizPeriodo');
            if (!di || !df) return;
            const semReceita = df < FLOOR_RECEITA;                    // período todo antes do Dunas confiável
            const parcialReceita = !semReceita && di < FLOOR_RECEITA; // período cruza o piso
            const notaReceita = semReceita
                ? ' · <span class="text-yellow-500">receita/conversão só a partir de dez/2025 (Dunas)</span>'
                : (parcialReceita ? ' · <span class="text-slate-500">receita/conversão contam desde dez/2025</span>' : '');
            per.innerHTML = `${fmtDataBR(di)} → ${fmtDataBR(df)}${notaReceita}`;
            body.innerHTML = '<tr><td colspan="5" class="py-6 text-center text-slate-500">Carregando…</td></tr>';
            try {
                const r = await fetch(EDGE_PAINEL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ metric: 'matriz_canais', data_inicio: di, data_fim: df }) });
                const j = await r.json();
                if (!j.ok) throw new Error(j.error || 'erro');
                const rows = j.rows || [];
                if (!rows.length) { body.innerHTML = '<tr><td colspan="5" class="py-6 text-center text-slate-500">Sem dados no período</td></tr>'; return; }
                body.innerHTML = rows.map(x => {
                    const cv = x.conversao_pct;
                    const cvCls = cv == null ? 'text-slate-500' : (cv >= 25 ? 'text-accentGreen' : (cv >= 12 ? 'text-yellow-500' : 'text-accentRed'));
                    const canalCls = x.canal === 'Sem rastreio' ? 'text-slate-400 italic' : 'text-white';
                    const cvCell = semReceita ? '<span class="text-slate-600">—</span>' : `<span class="${cvCls} font-bold">${fmtPct(cv)}</span>`;
                    const ticketCell = semReceita ? '<span class="text-slate-600">—</span>' : fmtBRL(x.ticket_medio);
                    const receitaCell = semReceita ? '<span class="text-slate-600">—</span>' : fmtReceita(x.receita);
                    return `<tr class="hover:bg-slate-800/30 transition-colors">
                        <td class="py-3 font-semibold ${canalCls}">${x.canal}</td>
                        <td class="py-3 text-center text-slate-300">${fmtInt(x.cotacoes)}</td>
                        <td class="py-3 text-center">${cvCell}</td>
                        <td class="py-3 text-center text-slate-300">${ticketCell}</td>
                        <td class="py-3 text-right text-slate-300 font-semibold">${receitaCell}</td>
                    </tr>`;
                }).join('');
                // Doughnut de receita — mesma fonte da matriz (só vendas confirmadas Dunas; vazio se antes do piso)
                if (window.chartReceita) {
                    const comReceita = semReceita ? [] : rows.filter(x => Number(x.receita) > 0);
                    window.chartReceita.data.labels = comReceita.map(x => x.canal);
                    window.chartReceita.data.datasets[0].data = comReceita.map(x => Number(x.receita));
                    window.chartReceita.data.datasets[0].backgroundColor = comReceita.map(x => CORES_CANAL[x.canal] || '#475569');
                    window.chartReceita.update();
                }
            } catch (e) {
                body.innerHTML = `<tr><td colspan="5" class="py-6 text-center text-accentRed">Erro: ${e.message}</td></tr>`;
            }
        }

        const MESES = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
        function labelMes(iso) { const [a, m] = iso.split('-'); return MESES[Number(m) - 1] + '/' + a.slice(2); }

        async function carregarLtvCac() {
            const di = document.getElementById('dtIni').value, df = document.getElementById('dtFim').value;
            const badge = document.getElementById('ltvCacBadge');
            if (!di || !df || !window.chartLtvCac) return;
            try {
                const r = await fetch(EDGE_PAINEL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ metric: 'ltv_cac_mensal', data_inicio: di, data_fim: df }) });
                const j = await r.json();
                if (!j.ok) throw new Error(j.error || 'erro');
                const rows = (j.rows || []).filter(x => x.mes >= FLOOR_RECEITA); // antes de dez/25 o retorno é ruído (sem Dunas + rastreio fraco)
                if (!rows.length) {
                    window.chartLtvCac.data.labels = [];
                    window.chartLtvCac.data.datasets[0].data = [];
                    window.chartLtvCac.data.datasets[1].data = [];
                    window.chartLtvCac.update();
                    badge.textContent = 'Sem dados (antes de dez/2025)'; badge.className = 'font-bold text-slate-500';
                    return;
                }
                window.chartLtvCac.data.labels = rows.map(x => labelMes(x.mes));
                window.chartLtvCac.data.datasets[0].data = rows.map(x => x.ltv);
                window.chartLtvCac.data.datasets[1].data = rows.map(x => x.cac);
                window.chartLtvCac.update();
                // Retorno do período (ponderado): receita dos clientes pagos ÷ gasto total de anúncio
                const totReceita = rows.reduce((a, x) => a + (Number(x.ltv) || 0) * (Number(x.clientes_pago) || 0), 0);
                const totGasto = rows.reduce((a, x) => a + (Number(x.gasto) || 0), 0);
                const ret = totGasto ? (totReceita / totGasto) : null;
                if (ret == null) { badge.textContent = 'Retorno: —'; badge.className = 'font-bold text-slate-400'; }
                else {
                    const cls = ret >= 3 ? 'text-accentGreen' : (ret >= 1 ? 'text-yellow-500' : 'text-accentRed');
                    badge.textContent = 'Retorno: ' + ret.toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + '×';
                    badge.className = 'font-bold ' + cls;
                }
            } catch (e) {
                badge.textContent = 'Erro'; badge.className = 'font-bold text-accentRed';
            }
        }

        function heatCohort(pct) {
            if (pct == null) return '<td class="py-2.5 text-slate-600">–</td>';
            const a = Math.min(0.92, 0.10 + pct / 55);              // + intenso = + concentração de pick-up
            const txt = pct >= 25 ? 'text-white font-bold' : 'text-slate-100';
            return `<td class="py-2.5 ${txt}" style="background: rgba(16,185,129,${a.toFixed(2)})">${fmtPct(pct)}</td>`;
        }
        function labelCoorte(iso) { const [a, m] = iso.split('-'); return MESES[Number(m) - 1] + ' ' + a; }

        async function carregarCohort() {
            const di = document.getElementById('dtIni').value, df = document.getElementById('dtFim').value;
            const body = document.getElementById('cohortBody');
            const per = document.getElementById('cohortPeriodo');
            if (!di || !df) return;
            body.innerHTML = '<tr><td colspan="7" class="py-6 text-center text-slate-500">Carregando…</td></tr>';
            try {
                const r = await fetch(EDGE_PAINEL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ metric: 'cohort_pickup', data_inicio: di, data_fim: df }) });
                const j = await r.json();
                if (!j.ok) throw new Error(j.error || 'erro');
                const rows = j.rows || [];
                if (per) per.textContent = rows.length ? `${labelCoorte(rows[0].coorte)} → ${labelCoorte(rows[rows.length - 1].coorte)}` : '';
                if (!rows.length) { body.innerHTML = '<tr><td colspan="7" class="py-6 text-center text-slate-500">Sem dados no período</td></tr>'; return; }
                body.innerHTML = rows.map(x => `<tr>
                    <td class="py-2.5 text-left font-semibold text-white">${labelCoorte(x.coorte)}</td>
                    <td class="py-2.5 bg-slate-800/40 font-bold">${fmtInt(x.clientes)}</td>
                    ${heatCohort(x.mes1)}${heatCohort(x.mes2)}${heatCohort(x.mes3)}${heatCohort(x.mes4)}${heatCohort(x.mes5plus)}
                </tr>`).join('');
            } catch (e) {
                body.innerHTML = `<tr><td colspan="7" class="py-6 text-center text-accentRed">Erro: ${e.message}</td></tr>`;
            }
        }

        function atualizarPainel2() { carregarMatriz(); carregarLtvCac(); carregarCohort(); }

        (function initPainel2() {
            document.getElementById('dtIni').value = isoMesesAtras(6);
            document.getElementById('dtFim').value = isoHoje();
            document.getElementById('btnAplicar').addEventListener('click', atualizarPainel2);
            atualizarPainel2();
        })();
    <\/script>
</body>
</html>
</script>

                plugins: { legend: { display: false }, tooltip: { callbacks: { label: (c) => { const t = c.dataset.data.reduce((a, b) => a + b, 0); return ` ${c.label}: ${Number(c.parsed).toLocaleString('pt-BR')} (${(100 * c.parsed / t).toFixed(1)}%)`; } } } }, cutout: '68%' }
        });
    <\/script>

    <!-- DADOS REAIS -->
    <script>
        const EDGE_PAINEL = 'https://abjzskmxfcqsxcoybsdg.supabase.co/functions/v1/frc-painel-eficiencia';
        const fmtInt = n => (n == null ? '—' : Number(n).toLocaleString('pt-BR'));
        const fmtUSD = n => (n == null ? '—' : 'US$ ' + Math.round(Number(n)).toLocaleString('pt-BR'));
        const fmtBRL = n => (n == null ? '—' : 'R$ ' + Math.round(Number(n)).toLocaleString('pt-BR'));
        const fmtUSDk = n => { n = Number(n || 0); if (n >= 1e6) return 'US$ ' + (n / 1e6).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' mi'; if (n >= 1e3) return 'US$ ' + Math.round(n / 1e3) + 'k'; return 'US$ ' + Math.round(n); };
        const fmtPct = n => (n == null ? '—' : Number(n).toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + '%');
        const fmtPct0 = n => (n == null ? '—' : Math.round(Number(n)) + '%');
        function isoHoje() { return new Date().toISOString().slice(0, 10); }
        function isoPrimeiroDiaMes() { const d = new Date(); return d.toISOString().slice(0, 8) + '01'; }
        function fmtDataBR(iso) { const [a, m, d] = iso.split('-'); return `${d}/${m}/${a}`; }
        function badgeCls(pct) { return pct >= 95 ? 'text-accentGreen bg-emerald-500/10' : (pct >= 80 ? 'text-yellow-500 bg-yellow-500/10' : 'text-accentRed bg-red-500/10'); }
        const CORES_FUNIL = ['from-sky-700 to-sky-600', 'from-sky-600 to-sky-500', 'from-orange-600 to-orange-500', 'from-emerald-600 to-emerald-500'];
        const CORES_LOST = ['#ef4444', '#f59e0b', '#3b82f6', '#8b5cf6', '#14b8a6', '#475569'];

        async function fetchMetric(metric) {
            const di = document.getElementById('dtIni').value, df = document.getElementById('dtFim').value;
            const r = await fetch(EDGE_PAINEL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ metric, data_inicio: di, data_fim: df }) });
            const j = await r.json();
            if (!j.ok) throw new Error(j.error || 'erro');
            return j;
        }

        async function carregarForecast() {
            try {
                const j = await fetchMetric('forecast');
                const r = j.resumo, dias = j.diario || [];
                const dd = r.dias_decorridos || 1, dm = r.dias_no_mes || 30;
                // Cards do dia
                const mediaUsd = r.fat_usd / dd, mediaBrl = r.fat_brl / dd, mediaVch = r.vouchers / dd;
                const metaDiaUsd = r.meta_usd / dm, metaDiaVch = r.meta_vouchers / dm;
                const pctDiaFat = metaDiaUsd ? 100 * mediaUsd / metaDiaUsd : 0;
                const pctDiaVol = metaDiaVch ? 100 * mediaVch / metaDiaVch : 0;
                document.getElementById('c1Valor').textContent = fmtUSD(mediaUsd);
                document.getElementById('c1Brl').textContent = fmtBRL(mediaBrl);
                document.getElementById('c1Meta').textContent = 'Meta diária: ' + fmtUSD(metaDiaUsd);
                setBadge('c1Badge', pctDiaFat);
                document.getElementById('c2Valor').textContent = mediaVch.toLocaleString('pt-BR', { maximumFractionDigits: 1 });
                document.getElementById('c2Meta').textContent = 'Meta diária: ' + metaDiaVch.toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' vouchers';
                setBadge('c2Badge', pctDiaVol);
                // Cards do mês (run-rate)
                const rrUsd = mediaUsd * dm, rrBrl = mediaBrl * dm, rrVch = mediaVch * dm;
                const pctMesFat = r.meta_usd ? 100 * rrUsd / r.meta_usd : 0;
                const pctMesVol = r.meta_vouchers ? 100 * rrVch / r.meta_vouchers : 0;
                document.getElementById('c3Valor').textContent = fmtUSD(rrUsd);
                document.getElementById('c3Brl').textContent = fmtBRL(rrBrl);
                document.getElementById('c3Meta').textContent = 'Meta mensal: ' + fmtUSD(r.meta_usd);
                setBadge('c3Badge', pctMesFat, true);
                document.getElementById('c4Valor').textContent = Math.round(rrVch).toLocaleString('pt-BR');
                document.getElementById('c4Meta').textContent = 'Meta mensal: ' + fmtInt(r.meta_vouchers) + ' vouchers';
                setBadge('c4Badge', pctMesVol, true);
                // Pace
                const labels = Array.from({ length: dm }, (_, i) => String(i + 1));
                const realiz = new Array(dm).fill(null);
                let acc = 0;
                dias.forEach(d => { const n = parseInt(d.dia.slice(8, 10)); acc += Number(d.fat_usd); if (n >= 1 && n <= dm) realiz[n - 1] = Math.round(acc); });
                const metaLin = labels.map((_, i) => Math.round(r.meta_usd / dm * (i + 1)));
                const proj = new Array(dm).fill(null);
                if (dd >= 1 && dd < dm) { proj[dd - 1] = r.fat_usd; for (let i = dd; i < dm; i++) proj[i] = Math.round(r.fat_usd + mediaUsd * (i - (dd - 1))); }
                window.chartPace.data.labels = labels;
                window.chartPace.data.datasets[0].data = realiz;
                window.chartPace.data.datasets[1].data = metaLin;
                window.chartPace.data.datasets[2].data = proj;
                window.chartPace.update();
            } catch (e) { console.error('forecast', e); }
        }
        function setBadge(id, pct, mensal) {
            const el = document.getElementById(id);
            el.textContent = (mensal ? '' : '') + fmtPct0(pct) + ' da meta';
            el.className = 'text-[10px] font-bold px-2 py-0.5 rounded ' + badgeCls(pct);
        }

        async function carregarFunil() {
            const box = document.getElementById('funilBox');
            const per = document.getElementById('funilPeriodo');
            const di = document.getElementById('dtIni').value, df = document.getElementById('dtFim').value;
            per.textContent = `${fmtDataBR(di)} → ${fmtDataBR(df)}`;
            try {
                const j = await fetchMetric('funil_comercial');
                const rows = j.rows || [];
                box.innerHTML = rows.map((x, i) => {
                    const trans = x.pct_transicao == null ? '' : `↪ ${fmtPct(x.pct_transicao)}`;
                    return `<div class="flex items-center gap-3">
                        <div class="w-32 text-right text-xs font-bold text-slate-400 shrink-0">${i + 1}. ${x.etapa}</div>
                        <div class="flex-1">
                            <div style="width:${Math.max(24, x.pct_topo)}%" class="h-9 bg-gradient-to-r ${CORES_FUNIL[i] || CORES_FUNIL[3]} rounded-lg text-white flex items-center justify-between px-4 text-xs font-bold shadow-md min-w-max">
                                <span>${fmtInt(x.leads)}</span><span class="pl-4">${fmtPct(x.pct_topo)}</span>
                            </div>
                        </div>
                        <div class="w-16 text-[11px] font-black text-slate-400 shrink-0 text-right">${trans}</div>
                    </div>`;
                }).join('');
            } catch (e) { box.innerHTML = `<p class="text-center text-accentRed text-sm">Erro: ${e.message}</p>`; }
        }

        async function carregarComparativo() {
            try {
                const j = await fetchMetric('forecast_comparativo');
                const rows = j.rows || [];
                window.chartComparativo.data.labels = rows.map(x => x.periodo);
                window.chartComparativo.data.datasets[0].data = rows.map(x => Math.round(x.fat_usd / 1000));
                window.chartComparativo.data.datasets[1].data = rows.map(x => x.vouchers);
                window.chartComparativo.update();
            } catch (e) { console.error('comparativo', e); }
        }

        async function carregarLost() {
            const per = document.getElementById('lostPeriodo');
            const stats = document.getElementById('lostStats');
            const lista = document.getElementById('lostLista');
            const nota = document.getElementById('lostNota');
            const di = document.getElementById('dtIni').value, df = document.getElementById('dtFim').value;
            per.textContent = `${fmtDataBR(di)} → ${fmtDataBR(df)}`;
            try {
                const j = await fetchMetric('lost_reasons');
                const rows = j.rows || [], r = j.resumo || {};
                // Stats do topo
                const cobCls = r.cobertura_pct >= 60 ? 'text-accentGreen' : (r.cobertura_pct >= 40 ? 'text-yellow-500' : 'text-accentRed');
                stats.innerHTML = `
                    <div class="bg-slate-800/40 rounded-lg p-2 text-center"><p class="text-[9px] text-slate-500 uppercase tracking-wider">Leads perdidos</p><p class="text-lg font-black text-white">${fmtInt(r.total_perdidos)}</p></div>
                    <div class="bg-slate-800/40 rounded-lg p-2 text-center"><p class="text-[9px] text-slate-500 uppercase tracking-wider">Com motivo</p><p class="text-lg font-black ${cobCls}">${fmtPct0(r.cobertura_pct)}</p></div>
                    <div class="bg-slate-800/40 rounded-lg p-2 text-center"><p class="text-[9px] text-slate-500 uppercase tracking-wider">Valor em risco</p><p class="text-lg font-black text-accentRed">${fmtUSDk(r.valor_total_usd)}</p></div>`;
                // Doughnut = só perdas REAIS (fora opt-out), por leads
                const reais = rows.filter(x => x.bucket !== 'Não contatar (opt-out)');
                window.chartLost.data.labels = reais.map(x => x.bucket);
                window.chartLost.data.datasets[0].data = reais.map(x => x.leads);
                window.chartLost.data.datasets[0].backgroundColor = reais.map((_, i) => CORES_LOST[i] || '#475569');
                window.chartLost.update();
                // Lista: TODOS os buckets com valor + tendência
                lista.innerHTML = rows.map((x) => {
                    const optOut = x.bucket === 'Não contatar (opt-out)';
                    const idx = reais.findIndex(y => y.bucket === x.bucket);
                    const cor = optOut ? '#64748b' : (CORES_LOST[idx] || '#475569');
                    let trend;
                    if (x.var_pct == null) trend = '<span class="text-slate-500">novo</span>';
                    else if (x.var_pct > 0) trend = `<span class="text-accentRed">▲ ${x.var_pct > 999 ? '+999' : x.var_pct}%</span>`;
                    else if (x.var_pct < 0) trend = `<span class="text-accentGreen">▼ ${Math.abs(x.var_pct)}%</span>`;
                    else trend = '<span class="text-slate-500">=</span>';
                    return `<div class="flex items-center justify-between gap-2 p-2 rounded-lg" style="background:${cor}14">
                        <div class="min-w-0">
                            <span class="font-bold block truncate" style="color:${cor}">${x.bucket}${optOut ? ' *' : ''}</span>
                            <span class="text-[10px] text-slate-400">${fmtInt(x.leads)} leads · ${fmtUSDk(x.valor_usd)}</span>
                        </div>
                        <div class="text-right shrink-0">
                            <span class="font-bold text-slate-200">${fmtPct(x.pct)}</span>
                            <span class="block text-[10px]">${trend}</span>
                        </div>
                    </div>`;
                }).join('');
                nota.innerHTML = `Cobertura: só <b class="text-slate-300">${fmtPct0(r.cobertura_pct)}</b> dos ${fmtInt(r.total_perdidos)} perdidos têm motivo tagueado — o resto vem vazio. <span class="text-slate-400">*</span> Opt-out = leads marcados "não enviar msg" (ação operacional, fora do gráfico). Valor ≈ leads × ticket médio (US$ ${fmtInt(r.ticket_usd)}).`;
            } catch (e) { lista.innerHTML = `<p class="text-accentRed">Erro: ${e.message}</p>`; }
        }

        function atualizarPainel3() { carregarForecast(); carregarFunil(); carregarComparativo(); carregarLost(); }

        (function initPainel3() {
            document.getElementById('dtIni').value = isoPrimeiroDiaMes();
            document.getElementById('dtFim').value = isoHoje();
            document.getElementById('baseNota').textContent = '(faturamento = venda confirmada no Dunas, desde dez/2025)';
            document.getElementById('btnAplicar').addEventListener('click', atualizarPainel3);
            atualizarPainel3();
        })();
    <\/script>
</body>
</html>

</script>
<script>
var loaded={};
function unesc(s){return s.split('<\\/script').join('</script');}
function fit(){var h=window.innerHeight-document.querySelector('.tabbar').offsetHeight;var fs=document.getElementsByTagName('iframe');for(var k=0;k<fs.length;k++){fs[k].style.height=h+'px';}}
function load(i){if(loaded[i])return;document.getElementById('f'+i).srcdoc=unesc(document.getElementById('src'+i).textContent);loaded[i]=true;}
function show(i){var ts=document.querySelectorAll('.tab');for(var k=0;k<ts.length;k++){ts[k].classList.toggle('active',parseInt(ts[k].dataset.i,10)===i);}for(var k=0;k<4;k++){document.getElementById('f'+k).classList.toggle('hidden',k!==i);}load(i);}
(function(){var ts=document.querySelectorAll('.tab');for(var k=0;k<ts.length;k++){ts[k].addEventListener('click',function(){show(parseInt(this.dataset.i,10));});}window.addEventListener('resize',fit);fit();load(0);})();
</script>
</body>
</html>
